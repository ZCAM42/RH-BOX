<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E4B3A">
<title>RHBox</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --foret:#0E4B3A; --foret-2:#146B52; --ambre:#EE9B1F; --ambre-clair:#FBE3B8;
    --brume:#EDF2EF; --encre:#10211B; --gris:#5E6F68; --ligne:#D5DFDA; --blanc:#fff;
    --rouge:#B3402A; --vert-ok:#1E7F4F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;background:var(--brume);color:var(--encre);-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  :focus-visible{outline:3px solid var(--ambre);outline-offset:2px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  h2{font-size:17px;font-weight:750;letter-spacing:-.01em;margin:22px 0 10px}
  .sous{color:var(--gris);font-size:14px;line-height:1.45;margin-top:6px}
  .note{font-size:12.5px;color:var(--gris);margin-top:14px;line-height:1.4}
  .centre{min-height:100dvh;display:grid;place-items:center;color:var(--gris)}

  /* Connexion et création de l'espace */
  .plein{min-height:100dvh;padding:34px 20px 40px;display:flex;flex-direction:column;align-items:center}
  .plein>*{width:100%;max-width:440px}
  .plein.vert{background:var(--foret);color:var(--blanc)}
  .plein.vert .sous{color:#bcd7cc}
  .logo-ligne{display:flex;align-items:center;gap:12px;margin-bottom:24px;font-size:24px;font-weight:800;letter-spacing:-.02em}
  .form label{display:block;font-size:13px;color:var(--gris);margin:14px 0 6px}
  .vert .form label{color:#bcd7cc}
  .form input,.form select{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--ligne);background:var(--blanc);font-size:16px}
  .vert .form input,.vert .form select{background:#0b3f31;border-color:#2f7a63;color:var(--blanc)}
  .btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:750;font-size:16px;background:var(--foret);color:var(--blanc);margin-top:20px}
  .btn.ambre{background:var(--ambre);color:var(--encre)}
  .btn.clair{background:var(--brume);color:var(--foret)}
  .btn.rouge{background:#f6d9d3;color:var(--rouge)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .lien{margin-top:18px;color:var(--foret-2);text-decoration:underline;font-size:14px;text-align:center;width:100%}
  .vert .lien{color:#bcd7cc}
  .msg{margin-top:14px;font-size:14px;color:var(--rouge);background:var(--blanc);padding:11px 13px;border-radius:10px;line-height:1.4}
  .msg.ok{color:var(--vert-ok)}
  .combo{position:relative}
  .options{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;list-style:none;background:var(--blanc);color:var(--encre);border-radius:12px;max-height:230px;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}
  .options.ouvert{display:block}
  .options li{padding:12px 14px;font-size:15px;border-bottom:1px solid var(--ligne);cursor:pointer}
  .options li:last-child{border-bottom:0}
  .options li:hover{background:var(--ambre-clair)}
  .options li.perso{font-weight:700;color:var(--foret)}
  .pack{margin-top:18px;background:var(--blanc);color:var(--encre);border-radius:16px;padding:16px;border-left:6px solid var(--ambre);font-size:14px;line-height:1.7}

  /* Application */
  .app{display:flex;flex-direction:column;height:100dvh}
  .ecran{flex:1;overflow-y:auto;padding:20px 18px 28px}
  .ecran>*{max-width:900px;margin-left:auto;margin-right:auto}
  .tabs{display:flex;background:var(--blanc);border-top:1px solid var(--ligne);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;color:var(--gris);border-radius:10px}
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-selected="true"]{color:var(--foret);font-weight:700}
  .tab[aria-selected="true"]::after{content:"";width:18px;height:3px;border-radius:2px;background:var(--ambre);margin-top:1px}
  .brand{display:none}
  .tab.extra{display:none}

  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
  .kpi{background:var(--blanc);border-radius:14px;padding:14px}
  .kpi small{display:block;color:var(--gris);font-size:12.5px;margin-bottom:4px}
  .kpi b{font-size:22px;letter-spacing:-.02em}
  .carte{background:var(--blanc);border-radius:16px;padding:14px;margin-bottom:10px}
  .etape{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--ligne);font-size:15px}
  .etape:first-child{border-top:0}
  .pastille{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ligne);display:grid;place-items:center;font-size:13px;font-weight:800;margin-top:1px}
  .pastille.fait{background:var(--foret-2);border-color:var(--foret-2);color:var(--blanc)}
  .recherche{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--ligne);background:var(--blanc);font-size:15px;margin:14px 0 10px}
  .sal{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--blanc);border-radius:14px;padding:12px;margin-bottom:8px}
  .avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ambre-clair);color:var(--foret);font-weight:800;display:grid;place-items:center}
  .sal strong{display:block;font-size:15px}
  .sal small{color:var(--gris);font-size:13px}
  .modules{background:var(--blanc);border-radius:16px;overflow:hidden}
  .module{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-top:1px solid var(--ligne);font-size:15px}
  .module:first-child{border-top:0}
  .module small{display:block;color:var(--gris);font-size:12.5px;margin-top:2px}
  .bientot{font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--brume);color:var(--gris);white-space:nowrap}
  .switch{position:relative;width:46px;height:28px;border-radius:14px;background:#b9c6c0;flex:none;transition:background .15s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--blanc);transition:transform .15s}
  .switch[aria-checked="true"]{background:var(--foret-2)}
  .switch[aria-checked="true"]::after{transform:translateX(18px)}
  .switch[disabled]{opacity:.5;cursor:not-allowed}
  .ligne-info{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--ligne);font-size:14.5px}
  .ligne-info:first-child{border-top:0}
  .ligne-info span:first-child{color:var(--gris)}
  .ligne-info span:last-child{font-weight:650;text-align:right}

  .fond{position:fixed;inset:0;background:rgba(16,33,27,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .fond.visible{display:flex}
  .feuille{background:var(--blanc);width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px 26px}
  .bar{height:10px;border-radius:6px;background:var(--brume);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--foret-2)}
  .brow{display:grid;grid-template-columns:120px 1fr 36px;gap:10px;align-items:center;font-size:13.5px;margin:9px 0}
  .brow span:last-child{text-align:right;font-weight:700}
  .niv{width:auto;padding:8px;border-radius:10px;border:1.5px solid var(--ligne);background:var(--blanc);font-size:14px}
  .chip-s{font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap}
  .s-ok{background:#d9efe3;color:var(--vert-ok)} .s-ko{background:#f6d9d3;color:var(--rouge)}
  .s-att{background:var(--ambre-clair);color:#8a5400} .s-nd{background:var(--brume);color:var(--gris)}
  .petit{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--brume);color:var(--foret);font-weight:700}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--encre);color:var(--blanc);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90%;text-align:center}
  .toast.on{opacity:1}

  @media (min-width:900px){
    .app{flex-direction:row}
    .tabs{order:-1;flex-direction:column;justify-content:flex-start;width:230px;flex:none;border-top:0;border-right:1px solid var(--ligne);padding:20px 14px;gap:3px}
    .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:11px 14px;text-align:left}
    .tab[aria-selected="true"]{background:var(--brume)}
    .tab[aria-selected="true"]::after{display:none}
    .brand{display:flex;align-items:center;gap:10px;padding:2px 10px 16px;font-weight:800;font-size:20px;letter-spacing:-.02em}
    .ecran{padding:32px 40px 40px}
    .fond{align-items:center}
    .tab.extra{display:flex}
    .tab.plus{display:none}
    .feuille{border-radius:22px;max-width:460px}
    .toast{bottom:28px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 64 64">
    <polygon points="8,20 32,33 32,59 8,46" fill="#0b3f31"/>
    <polygon points="56,20 32,33 32,59 56,46" fill="#146B52"/>
    <polygon points="32,7 56,20 32,33 8,20" fill="#EE9B1F"/>
    <circle cx="32" cy="16.5" r="4.6" fill="#fff"/>
    <path d="M23.5 23.5c1.6-4.2 4.8-5.6 8.5-5.6s6.9 1.4 8.5 5.6L32 28.3z" fill="#fff"/>
  </symbol>
</svg>
<div id="root"><div class="centre">Chargement…</div></div>
<div class="fond" id="fond"><div class="feuille" id="feuille" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ Configuration (clés publiques : sans danger dans l'application) ============ */
const CFG = {
  url: 'https://bikimifpstkzcyocxmbg.supabase.co',
  // Clé "anon" publique du projet. Ne mettez JAMAIS ici la clé service_role ni le mot de passe de la base.
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpa2ltaWZwc3RremN5b2N4bWJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzOTY5MTIsImV4cCI6MjEwNjk3MjkxMn0.wggNLKWaPiu-17KafuDNP-8zCkPZEejrlSgV7QoycT0'
};

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const ini = (a, b) => ((a || '')[0] || '') + ((b || '')[0] || '');

const ROLES = { admin:'Administrateur', drh:'DRH', hr_manager:'Responsable RH', hr_assistant:'Assistant RH', manager:'Manager', employee:'Salarié' };
const RH = ['admin','drh','hr_manager','hr_assistant'];
const RH_SENIOR = ['admin','drh','hr_manager'];
const MODULES = {
  employees:['Salariés','Dossiers, contrats, documents',true],
  attendance:['Présence','Pointage, retards, heures supplémentaires',true],
  leave:['Congés','Demandes, validation, soldes',true],
  payroll:['Paie','Bulletins, primes, cotisations',true],
  recruitment:['Recrutement','Offres, candidats, score expliqué',true],
  career:['Carrière, formation et GPEC','Évaluations, compétences, plan de formation',true],
  communication:['Communication','Annonces et notes de service',true],
  documents:['Documents','Contrats, attestations, règlement',true],
  reports:['Rapports','Masse salariale, effectifs, exports',true],
  ai:['Assistant IA','Questions sur le droit du travail',false]
};

const S = { session:null, profile:null, company:null, employees:[], modules:[], countries:[], sectors:[], tab:'accueil', loading:true, recherche:'' };

/* ============ Accès à Supabase (sans bibliothèque) ============ */
function saveSession(d){
  S.session = { access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600), user:d.user };
  localStorage.setItem('rhbox_session', JSON.stringify(S.session));
}
function loadSession(){ try{ S.session = JSON.parse(localStorage.getItem('rhbox_session')); }catch{ S.session = null; } }
function resetLocal(){
  S.session = null; S.profile = null; S.company = null; S.employees = []; S.modules = []; S.me = null; S.tab = 'accueil';
  localStorage.removeItem('rhbox_session');
}
async function raw(path, { method='GET', body, headers={}, auth=true } = {}){
  const h = { apikey: CFG.key, 'Content-Type':'application/json', ...headers };
  if (auth && S.session) h.Authorization = 'Bearer ' + S.session.access_token;
  const r = await fetch(CFG.url + path, { method, headers:h, body: body ? JSON.stringify(body) : undefined });
  const t = await r.text(); let data = null;
  if (t){ try{ data = JSON.parse(t); }catch{ data = t; } }
  if (!r.ok){
    const m = (data && (data.message || data.msg || data.error_description || data.error)) || ('Erreur ' + r.status);
    const e = new Error(m); e.status = r.status; throw e;
  }
  return data;
}
async function refreshIfNeeded(){
  if (!S.session || S.session.expires_at - 60 > Date.now()/1000) return;
  try{
    const d = await raw('/auth/v1/token?grant_type=refresh_token', { method:'POST', body:{ refresh_token:S.session.refresh_token }, auth:false });
    saveSession(d);
  }catch{ resetLocal(); render(); throw new Error('Session expirée, reconnectez-vous.'); }
}
async function api(path, opts={}){ await refreshIfNeeded(); return raw(path, opts); }

function traduire(m){
  if (/invalid login/i.test(m)) return 'E-mail ou mot de passe incorrect.';
  if (/not confirmed/i.test(m)) return "Confirmez d'abord votre e-mail (lien reçu par message).";
  if (/already registered|already been registered/i.test(m)) return 'Un compte existe déjà avec cet e-mail.';
  if (/password/i.test(m) && /6|8|short|weak/i.test(m)) return 'Mot de passe trop court (8 caractères minimum).';
  if (/failed to fetch|networkerror/i.test(m)) return 'Pas de connexion internet.';
  if (/foreign key/i.test(m)) return 'Impossible : cet élément est déjà utilisé ailleurs.';
  if (/duplicate key|unique constraint/i.test(m)) return 'Un matricule existe déjà : vérifiez les doublons.';
  return m;
}

/* ============ Chargement des données ============ */
async function loadRefs(){
  const [c, s] = await Promise.all([
    api('/rest/v1/countries?select=code,name,currency&order=name.asc'),
    api('/rest/v1/sectors?select=name&order=name.asc')
  ]);
  S.countries = c; S.sectors = s.map(x => x.name);
}
async function loadCompany(){
  const [co, mo] = await Promise.all([
    api('/rest/v1/companies?select=id,name,country_code,sector_name,work_start,retirement_age'),
    api('/rest/v1/company_modules?select=module_code,enabled')
  ]);
  S.company = co[0] || null; S.modules = mo;
  await loadEmployees();
  await loadMe();
}
async function loadEmployees(){
  S.employees = await api('/rest/v1/employees?select=id,first_name,last_name,job_title,department,matricule,phone,email,hired_on,user_id&order=last_name.asc');
}
async function loadMe(){
  const r = await api(`/rest/v1/employees?select=id,first_name,last_name,job_title,phone,address,birth_date,marital_status&user_id=eq.${S.session.user.id}&limit=1`);
  S.me = r[0] || null;
}
async function loadAll(){
  S.loading = true; render();
  try{
    await loadRefs();
    const p = await api(`/rest/v1/profiles?select=id,company_id,full_name,role,email&id=eq.${S.session.user.id}`);
    S.profile = p[0] || null;
    if (S.profile) await loadCompany();
  }catch(e){ toast(traduire(e.message)); }
  S.loading = false; render();
}

/* ============ Affichage ============ */
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); }
function ouvrirFeuille(html){ $('#feuille').innerHTML = html; $('#fond').classList.add('visible'); }
function fermerFeuille(){ $('#fond').classList.remove('visible'); }
$('#fond').addEventListener('click', e => { if (e.target.id === 'fond') fermerFeuille(); });
const logo = t => `<div class="logo-ligne"><svg width="52" height="52" aria-hidden="true"><use href="#logo"/></svg><span>${t}</span></div>`;

function render(){
  const root = $('#root');
  if (S.loading) { root.innerHTML = '<div class="centre">Chargement…</div>'; return; }
  if (!S.session) return viewAuth(root);
  if (!S.profile) return viewOnboard(root);
  viewApp(root);
}

/* ---------- Connexion / inscription ---------- */
let modeAuth = 'connexion';
function viewAuth(root){
  root.innerHTML = `<main class="plein">
    ${logo('RHBox')}
    <h1>${modeAuth === 'connexion' ? 'Connexion' : 'Créer votre compte'}</h1>
    <p class="sous">${modeAuth === 'connexion' ? 'Retrouvez l\'espace RH de votre entreprise.' : 'Quelques secondes suffisent pour commencer.'}</p>
    <form class="form" id="f-auth">
      <label for="email">E-mail</label>
      <input id="email" type="email" required autocomplete="email" inputmode="email">
      <label for="pwd">Mot de passe</label>
      <input id="pwd" type="password" required minlength="8" autocomplete="${modeAuth === 'connexion' ? 'current-password' : 'new-password'}">
      <button class="btn" id="b-auth">${modeAuth === 'connexion' ? 'Se connecter' : 'Créer mon compte'}</button>
    </form>
    <div id="msg-auth" role="status"></div>
    <button class="lien" id="b-mode">${modeAuth === 'connexion' ? "Pas encore de compte ? S'inscrire" : 'Déjà un compte ? Se connecter'}</button>
  </main>`;
  $('#b-mode').onclick = () => { modeAuth = modeAuth === 'connexion' ? 'inscription' : 'connexion'; render(); };
  $('#f-auth').onsubmit = async e => {
    e.preventDefault();
    const email = $('#email').value.trim(), password = $('#pwd').value;
    const b = $('#b-auth'), m = $('#msg-auth'); b.disabled = true; m.innerHTML = '';
    try{
      if (modeAuth === 'inscription'){
        const d = await raw('/auth/v1/signup', { method:'POST', body:{ email, password }, auth:false });
        if (d && d.access_token){ saveSession(d); return loadAll(); }
        m.innerHTML = '<p class="msg ok">Compte créé. Confirmez votre e-mail avec le lien reçu, puis connectez-vous.</p>';
        modeAuth = 'connexion';
      } else {
        const d = await raw('/auth/v1/token?grant_type=password', { method:'POST', body:{ email, password }, auth:false });
        saveSession(d); return loadAll();
      }
    }catch(err){ m.innerHTML = `<p class="msg">${esc(traduire(err.message))}</p>`; }
    b.disabled = false;
  };
}

/* ---------- Création de l'espace ---------- */
function viewOnboard(root){
  root.innerHTML = `<main class="plein vert">
    ${logo('RHBox')}
    <h1>Créez l'espace RH de votre entreprise</h1>
    <p class="sous">Choisissez votre pays et votre secteur d'activité.</p>
    <form class="form" id="f-on">
      <label for="ent">Nom de l'entreprise</label>
      <input id="ent" required autocomplete="organization">
      <label for="nom">Votre nom</label>
      <input id="nom" autocomplete="name">
      <label for="pays">Pays</label>
      <select id="pays" required><option value="">Choisir un pays</option>${S.countries.map(c => `<option value="${esc(c.code)}">${esc(c.name)}</option>`).join('')}</select>
      <div class="combo"><label for="sect">Secteur d'activité</label>
        <input id="sect" required autocomplete="off" placeholder="Chercher votre secteur" role="combobox" aria-expanded="false" aria-controls="opts">
        <ul class="options" id="opts" role="listbox"></ul></div>
      <div id="pack"></div>
      <button class="btn ambre" id="b-on" disabled>Créer mon espace</button>
    </form>
    <div id="msg-on" role="alert"></div>
    <button class="lien" id="b-join">J'ai un code d'invitation</button>
    <button class="lien" id="b-out" style="margin-top:6px">Se déconnecter</button>
  </main>`;
  const sect = $('#sect'), opts = $('#opts');
  let choisi = '';
  const maj = () => {
    const c = S.countries.find(x => x.code === $('#pays').value);
    $('#pack').innerHTML = (c && choisi) ? `<div class="pack"><strong>Votre espace</strong><br>Pays : ${esc(c.name)}<br>Monnaie : ${esc(c.currency)}<br>Secteur : ${esc(choisi)}<br><span style="color:var(--gris);font-size:13px">Les règles de paie et de congés seront activées après vérification des textes officiels du pays.</span></div>` : '';
    $('#b-on').disabled = !(c && choisi);
  };
  const liste = () => {
    const brut = sect.value.trim(), q = norm(brut);
    const res = S.sectors.filter(s => norm(s).includes(q)).slice(0, 12);
    let h = res.map(s => `<li role="option" data-v="${esc(s)}">${esc(s)}</li>`).join('');
    if (brut && !S.sectors.some(s => norm(s) === q)) h += `<li role="option" class="perso" data-v="${esc(brut)}">Utiliser « ${esc(brut)} »</li>`;
    opts.innerHTML = h; opts.classList.toggle('ouvert', !!h); sect.setAttribute('aria-expanded', !!h);
  };
  sect.oninput = () => { choisi = ''; maj(); liste(); };
  sect.onfocus = liste;
  opts.onmousedown = opts.ontouchstart = e => {
    const li = e.target.closest('li'); if (!li) return;
    e.preventDefault(); choisi = li.dataset.v; sect.value = choisi; opts.classList.remove('ouvert'); maj();
  };
  sect.onblur = () => { setTimeout(() => { opts.classList.remove('ouvert'); if (!choisi && sect.value.trim()){ const ex = S.sectors.find(s => norm(s) === norm(sect.value.trim())); choisi = ex || sect.value.trim(); sect.value = choisi; maj(); } }, 150); };
  $('#pays').onchange = maj;
  $('#b-out').onclick = signout;
  $('#b-join').onclick = () => viewJoin($('#root'));
  $('#f-on').onsubmit = async e => {
    e.preventDefault();
    const b = $('#b-on'); b.disabled = true; $('#msg-on').innerHTML = '';
    try{
      await api('/rest/v1/rpc/create_company', { method:'POST', body:{ p_name:$('#ent').value, p_country:$('#pays').value, p_sector:choisi, p_full_name:$('#nom').value || null } });
      return loadAll();
    }catch(err){ $('#msg-on').innerHTML = `<p class="msg">${esc(traduire(err.message))}</p>`; b.disabled = false; }
  };
}

async function chargerDocs(empId, sel, peutSuppr){
  const z = $(sel); if (!z) return;
  if (!empId){ z.innerHTML = '<p class="sous" style="padding:10px 0">Aucun document pour le moment.</p>'; return; }
  try{
    const d = await api(`/rest/v1/documents?select=id,kind,name,storage_key,created_at&employee_id=eq.${encodeURIComponent(empId)}&order=created_at.desc`);
    z.innerHTML = d.length ? d.map(x => `<div class="ligne-info" style="align-items:center">
        <span style="color:var(--encre)"><strong style="display:block;font-size:14.5px">${esc(x.name)}</strong><small style="color:var(--gris)">${esc(DOC_TYPES[x.kind] || x.kind)}</small></span>
        <span><button class="petit" data-o="${esc(x.storage_key)}">Ouvrir</button>${peutSuppr ? ` <button class="petit" data-s="${esc(x.id)}" data-k="${esc(x.storage_key)}" style="color:var(--rouge)">Supprimer</button>` : ''}</span></div>`).join('')
      : '<p class="sous" style="padding:10px 0">Aucun document pour le moment.</p>';
    z.querySelectorAll('[data-o]').forEach(b => b.onclick = () => ouvrirDoc(b.dataset.o));
    z.querySelectorAll('[data-s]').forEach(b => b.onclick = async () => {
      if (!confirm('Supprimer ce document ?')) return;
      await supprimerDoc(b.dataset.s, b.dataset.k); chargerDocs(empId, sel, peutSuppr);
    });
  }catch(err){ z.innerHTML = `<p class="msg">${esc(traduire(err.message))}</p>`; }
}
async function ouvrirDoc(path){
  const w = window.open('', '_blank');
  try{
    const d = await api(`/storage/v1/object/sign/documents/${chemin(path)}`, { method:'POST', body:{ expiresIn:120 } });
    const url = CFG.url + '/storage/v1' + d.signedURL;
    if (w) w.location = url; else location.href = url;
  }catch(err){ if (w) w.close(); toast(traduire(err.message)); }
}
async function supprimerDoc(id, path){
  try{ await api(`/storage/v1/object/documents/${chemin(path)}`, { method:'DELETE' }); }catch{}
  try{ await api(`/rest/v1/documents?id=eq.${encodeURIComponent(id)}`, { method:'DELETE' }); toast('Document supprimé'); }
  catch(err){ toast(traduire(err.message)); }
}
async function envoyerDoc(empId, kind, label, file){
  if (file.size > 10 * 1024 * 1024) throw new Error('Fichier trop lourd (10 Mo maximum).');
  await refreshIfNeeded();
  const propre = file.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9._-]/g, '_');
  const path = `${S.profile.company_id}/${empId}/${Date.now()}-${propre}`;
  const r = await fetch(`${CFG.url}/storage/v1/object/documents/${chemin(path)}`, { method:'POST',
    headers:{ apikey:CFG.key, Authorization:'Bearer ' + S.session.access_token, 'Content-Type': file.type || 'application/octet-stream', 'x-upsert':'false' }, body:file });
  if (!r.ok){ let m = "Envoi impossible"; try{ const j = await r.json(); m = j.message || j.error || m; }catch{} throw new Error(m); }
  try{
    await api('/rest/v1/documents', { method:'POST', headers:{ Prefer:'return=minimal' },
      body:{ company_id:S.profile.company_id, employee_id:empId === 'entreprise' ? null : empId, kind, name:label || file.name, storage_key:path } });
  }catch(err){ try{ await api(`/storage/v1/object/documents/${chemin(path)}`, { method:'DELETE' }); }catch{} throw err; }
}

  IMP_NOTE = note;

/* ============ Import depuis Excel / CSV (sans IA, gratuit) ============ */
const SYNONYMES = [
  ['hired_on', ['date d embauche','date embauche','embauche','date d entree','date entree','date de recrutement','recrutement','date d arrivee','hire date','date of hire']],
  ['birth_date', ['date de naissance','naissance','ne le','nee le','birth date','date naissance']],
  ['full_name', ['nom et prenoms','nom et prenom','noms et prenoms','nom prenoms','nom prenom','nom complet','noms prenoms','employe','salarie','agent','full name','name','identite']],
  ['first_name', ['prenom','prenoms','first name','firstname','given name']],
  ['last_name', ['nom','noms','nom de famille','nom famille','last name','lastname','surname','family name']],
  ['matricule', ['matricule','mat','n matricule','no matricule','numero matricule','numero de matricule','id employe','code employe','code','employee id']],
  ['job_title', ['poste','fonction','role','emploi','titre','job','metier','profession','intitule du poste','intitule poste','job title','position']],
  ['department', ['service','departement','direction','division','unite','department']],
  ['phone', ['telephone','tel','mobile','portable','contact','numero de telephone','phone','cellulaire','telephone portable']],
  ['email', ['email','e mail','mail','courriel','adresse email','adresse mail','adresse e mail']],
  ['marital_status', ['situation familiale','situation matrimoniale','statut matrimonial','etat civil','situation de famille']],
  ['address', ['adresse','domicile','residence','lieu d habitation','adresse postale','adresse physique']]
];
const MOIS = { janvier:1, fevrier:2, mars:3, avril:4, mai:5, juin:6, juillet:7, aout:8, septembre:9, octobre:10, novembre:11, decembre:12 };
const nh = s => norm(String(s ?? '')).replace(/[^a-z0-9]+/g, ' ').trim();

function champDe(entete){
  const t = nh(entete); if (!t) return null;
  for (const [champ, liste] of SYNONYMES) if (liste.includes(t)) return champ;
  if (t.includes('embauche')) return 'hired_on';
  if (t.includes('naissance')) return 'birth_date';
  if (t.includes('matricule')) return 'matricule';
  if (t.includes('mail')) return 'email';
  if (t.includes('telephone')) return 'phone';
  if (t.includes('prenom')) return 'first_name';
  if (t.includes('poste') || t.includes('fonction')) return 'job_title';
  if (t.includes('service') || t.includes('depart')) return 'department';
  if (t.includes('situation')) return 'marital_status';
  if (t.includes('adresse')) return 'address';
  if (t.split(' ')[0] === 'nom') return 'last_name';
  return null;
}
function separerNom(s, nomEnPremier){
  const t = String(s).trim().split(/\s+/).filter(Boolean);
  if (!t.length) return ['', ''];
  if (t.length === 1) return [t[0], ''];
  const maj = w => w.length > 1 && w === w.toUpperCase() && w !== w.toLowerCase();
  const caps = t.filter(maj), autres = t.filter(w => !maj(w));
  if (caps.length && autres.length) return [autres.join(' '), caps.join(' ')];
  return nomEnPremier ? [t.slice(1).join(' '), t[0]] : [t[0], t.slice(1).join(' ')];
}
function fmtDate(y, mo, d){
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  const dt = new Date(Date.UTC(y, mo - 1, d));
  return dt.getUTCMonth() === mo - 1 ? dt.toISOString().slice(0, 10) : null;
}
function dateIsoDe(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v > 1 && v < 80000 ? new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000).toISOString().slice(0, 10) : null;
  const s = norm(String(v)).trim(); let m;
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return fmtDate(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[-\/. ](\d{1,2})[-\/. ](\d{2,4})$/))){ let a = +m[3]; if (a < 100) a += a < 30 ? 2000 : 1900; return fmtDate(a, +m[2], +m[1]); }
  if ((m = s.match(/^(\d{1,2})\s+([a-z]+)\.?\s+(\d{4})$/)) && MOIS[m[2]]) return fmtDate(+m[3], MOIS[m[2]], +m[1]);
  return null;
}
function lireTexte(buf){
  let t; try{ t = new TextDecoder('utf-8', { fatal:true }).decode(buf); }catch{ t = new TextDecoder('windows-1252').decode(buf); }
  return t.replace(/^\uFEFF/, '');
}
function parserCsv(txt){
  txt = txt.replace(/^sep=.\r?\n/i, '');
  const premiere = txt.split(/\r?\n/).find(l => l.trim()) || '';
  const sep = [';', '\t', ','].map(c => [c, premiere.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let ligne = [], cell = '', q = false;
  for (let i = 0; i < txt.length; i++){
    const c = txt[i];
    if (q){ if (c === '"'){ if (txt[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === sep){ ligne.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && txt[i + 1] === '\n') i++; ligne.push(cell); cell = ''; rows.push(ligne); ligne = []; }
    else cell += c;
  }
  if (cell !== '' || ligne.length){ ligne.push(cell); rows.push(ligne); }
  return rows;
}
function tableauVersSalaries(tab){
  tab = tab.filter(l => l.some(c => String(c ?? '').trim() !== ''));
  if (tab.length < 2) throw new Error("Le fichier doit contenir une ligne de titres, puis les salariés.");
  const idx = {}, reconnus = [], ignores = [];
  tab[0].forEach((e, i) => {
    const c = champDe(e), nom = String(e ?? '').trim();
    if (c && idx[c] === undefined){ idx[c] = i; reconnus.push(nom); } else if (nom) ignores.push(nom);
  });
  if (idx.full_name === undefined && idx.first_name === undefined && idx.last_name === undefined)
    throw new Error("Colonne du nom introuvable. Utilisez le modèle (bouton « Télécharger le modèle »).");
  const get = (l, k) => idx[k] === undefined ? null : l[idx[k]];
  const txt = v => { if (v == null) return null; const s = String(v).trim(); return s || null; };
  const rows = tab.slice(1, 2001).map(l => {
    let prenom = txt(get(l, 'first_name')), nom = txt(get(l, 'last_name'));
    if (idx.full_name !== undefined && !(prenom && nom)){
      const [p, n] = separerNom(txt(get(l, 'full_name')) || '', nh(tab[0][idx.full_name]).startsWith('nom'));
      prenom = prenom || p || null; nom = nom || n || null;
    }
    return { first_name:prenom, last_name:nom, matricule:txt(get(l, 'matricule')), job_title:txt(get(l, 'job_title')), department:txt(get(l, 'department')),
      phone:txt(get(l, 'phone')), email:txt(get(l, 'email')), hired_on:dateIsoDe(get(l, 'hired_on')), birth_date:dateIsoDe(get(l, 'birth_date')),
      marital_status:txt(get(l, 'marital_status')), address:txt(get(l, 'address')) };
  }).filter(r => r.first_name || r.last_name);
  return { rows, reconnus, ignores, tronque: tab.length - 1 > 2000 };
}
function chargerXlsx(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(window.XLSX);
    s.onerror = () => rej(new Error("Impossible de charger le lecteur Excel. Enregistrez votre fichier au format CSV et réessayez."));
    document.head.appendChild(s);
  });
}

  ouvrirFeuille(`<h2 style="margin-top:0">Demander un congé</h2><form class="form" id="f-conge">

async function ficheCarriere(empId){
  ouvrirFeuille('<p class="sous">Chargement…</p>');
  try{
    const r0 = await api(`/rest/v1/employees?select=id,first_name,last_name,job_title,job_profile_id&id=eq.${encodeURIComponent(empId)}`);

      api(`/rest/v1/employee_skills?select=skill_id,level&employee_id=eq.${encodeURIComponent(empId)}`),
      api(`/rest/v1/reviews?select=id,period,score,comment&employee_id=eq.${encodeURIComponent(empId)}&order=period.desc`),
      api(`/rest/v1/trainings?select=id,title,planned_on,done_on&employee_id=eq.${encodeURIComponent(empId)}&order=planned_on.desc`),
      api('/rest/v1/job_profiles?select=id,title&order=title.asc'),
      api('/rest/v1/skills?select=id,name&order=name.asc'),
      emp.job_profile_id ? api(`/rest/v1/job_profile_skills?select=skill_id,required_level&job_profile_id=eq.${emp.job_profile_id}`) : Promise.resolve([])
    ]);

function dessinerCarriere(emp, acq, evals, forms, profils, catalogue, req){

  const dispo = catalogue.filter(c => !ids.includes(c.id));
  ouvrirFeuille(`<div style="display:flex;gap:14px;align-items:center;margin-bottom:6px"><div class="avatar" style="width:52px;height:52px;font-size:18px">${esc(ini(emp.first_name, emp.last_name))}</div>
    <div><strong style="font-size:18px">${esc(emp.first_name)} ${esc(emp.last_name)}</strong><br><small style="color:var(--gris)">${esc(emp.job_title || 'Poste à préciser')}</small></div></div>

      ${hr ? `<select class="niv" data-sk="${id}">${NIVEAUX.map((t, i) => `<option value="${i}" ${i === n ? 'selected' : ''}>${t}</option>`).join('')}</select>` : `<span>${NIVEAUX[n]}</span>`}</div>`; }).join('')
      : '<p class="sous">Aucune compétence renseignée.</p>'}
    ${hr && dispo.length ? `<div style="display:flex;gap:8px;margin-top:10px"><select class="niv" id="fc-add" style="flex:1"><option value="">Ajouter une compétence…</option>${dispo.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>` : ''}

    ${evals.length ? evals.map(v => `<div class="ligne-info"><span style="color:var(--encre)"><strong style="font-size:14.5px">${esc(v.period)}</strong>${v.comment ? `<small style="display:block;color:var(--gris)">${esc(v.comment)}</small>` : ''}</span><span>${v.score != null ? v.score + ' / 5' : '—'}</span></div>`).join('') : '<p class="sous">Aucune évaluation.</p>'}

    <h2>Formations</h2>
    ${forms.length ? forms.map(f => `<div class="ligne-info"><span style="color:var(--encre)">${esc(f.title)}</span><span>${f.done_on ? 'Réalisée' : (f.planned_on ? jourFr(f.planned_on) : 'À planifier')}</span></div>`).join('') : '<p class="sous">Aucune formation.</p>'}

    catch(err){ toast(traduire(err.message)); }
  };
  const sauverNiveau = async (skillId, level) => {
    await api('/rest/v1/employee_skills?on_conflict=employee_id,skill_id', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates,return=minimal' }, body:{ employee_id:emp.id, skill_id:skillId, level } });

const ageDe = d => Math.floor((Date.now() - new Date(d + 'T00:00:00')) / 31557600000);

  if (!estRH()){ e.innerHTML = '<h1>GPEC</h1><p class="sous">Réservé aux rôles RH.</p>'; return; }

    const [emps, skills, profils, ps, es] = await Promise.all([
      api('/rest/v1/employees?select=id,first_name,last_name,job_title,department,birth_date,job_profile_id&left_on=is.null&order=last_name.asc'),
      api('/rest/v1/skills?select=id,name&order=name.asc'),
      api('/rest/v1/job_profiles?select=id,title&order=title.asc'),
      api('/rest/v1/job_profile_skills?select=job_profile_id,skill_id,required_level'),
      api('/rest/v1/employee_skills?select=employee_id,skill_id,level')

    const nomSk = id => (skills.find(s => s.id === id) || {}).name || '?';

    const moy = ages.length ? Math.round(ages.reduce((s, o) => s + o.a, 0) / ages.length) : null;
    const tranches = [['Moins de 30 ans', a => a < 30], ['30 à 39 ans', a => a >= 30 && a < 40], ['40 à 49 ans', a => a >= 40 && a < 50], ['50 à 59 ans', a => a >= 50 && a < 60], ['60 ans et plus', a => a >= 60]];
    const nbT = tranches.map(([, f]) => ages.filter(o => f(o.a)).length), maxT = Math.max(1, ...nbT);

        ${ra ? (departs.length ? departs.map(o => `<div class="ligne-info"><span style="color:var(--encre)">${esc(o.x.first_name)} ${esc(o.x.last_name)}</span><span>${o.an <= annee ? 'Âge atteint' : 'en ' + o.an}</span></div>`).join('') : '<p class="sous">Aucun départ prévu sur 5 ans.</p>')

const devise = () => { const c = (S.countries.find(x => x.code === S.company.country_code) || {}).currency; return c === 'XOF' || c === 'XAF' ? 'F CFA' : (c || ''); };

function telechargerCsv(nom, lignes){
  const csv = '\uFEFF' + lignes.map(l => l.map(c => { const s = String(c == null ? '' : c); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' })); a.download = nom;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ============ Paie ============ */
const TYPES_REGLE = { prime:'Prime ou indemnité', retenue_salarie:'Retenue sur le salarié', charge_employeur:"Charge de l'employeur" };
const AVERTISSEMENT_PAIE = '<div class="carte" style="border-left:6px solid var(--ambre)"><strong>À savoir</strong><p class="sous" style="margin-top:4px">Les règles et taux sont saisis par votre entreprise. L\'application n\'applique aucune loi automatiquement : vérifiez les taux (cotisations sociales, impôts) avec les textes officiels de votre pays ou avec un comptable. Les barèmes progressifs seront ajoutés avec les règles officielles de chaque pays.</p></div>';

function calculerPaie(emps, contrats, regles, periode){
  const [an, mo] = periode.split('-').map(Number);
  const debut = periode + '-01', fin = new Date(Date.UTC(an, mo, 0)).toISOString().slice(0, 10);
  const montant = (r, base, brut) => Math.round(r.mode === 'fixed' ? Number(r.value) : (r.base === 'brut' ? brut : base) * Number(r.value) / 100);
  return emps.filter(x => !x.left_on || x.left_on >= debut).map(x => {
    const ct = contrats.filter(c => c.employee_id === x.id && c.starts_on <= fin && (!c.ends_on || c.ends_on >= debut)).sort((a, b) => b.starts_on.localeCompare(a.starts_on))[0];
    if (!ct) return null;
    const base = Math.round(Number(ct.base_salary)), lignes = [{ rule_code:'base', label:'Salaire de base', kind:'earning', amount:base }];
    regles.filter(r => r.kind === 'prime').forEach(r => lignes.push({ rule_code:r.id, label:r.label, kind:'earning', amount:montant(r, base, base) }));
    const brut = lignes.reduce((s, l) => s + l.amount, 0);
    regles.filter(r => r.kind === 'retenue_salarie').forEach(r => lignes.push({ rule_code:r.id, label:r.label, kind:'deduction', amount:montant(r, base, brut) }));
    const retenues = lignes.filter(l => l.kind === 'deduction').reduce((s, l) => s + l.amount, 0);
    regles.filter(r => r.kind === 'charge_employeur').forEach(r => lignes.push({ rule_code:r.id, label:r.label, kind:'employer_cost', amount:montant(r, base, brut) }));
    const charges = lignes.filter(l => l.kind === 'employer_cost').reduce((s, l) => s + l.amount, 0);
    return { emp:x, lignes, brut, net:brut - retenues, cout:brut + charges };
  }).filter(Boolean);
}
function htmlBulletin(emp, periode, lignes, net, avecCharges){
  const g = k => lignes.filter(l => l.kind === k);
  const tab = (titre, ls) => ls.length ? `<h2>${titre}</h2><table>${ls.map(l => `<tr><td>${esc(l.label)}</td><td>${fmtF(l.amount)}</td></tr>`).join('')}</table>` : '';

async function apercuPaie(emps, contrats, regles, periode, apres){
  const z = $('#pa-res'); if (!periode){ z.innerHTML = '<p class="msg">Choisissez un mois.</p>'; return; }
  const res = calculerPaie(emps, contrats, regles, periode);
  if (!res.length){ z.innerHTML = '<p class="msg">Aucun salarié avec un contrat actif ce mois-là. Définissez d\'abord les salaires.</p>'; return; }
  const t = k => res.reduce((s, r) => s + r[k], 0);
  z.innerHTML = `<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-top:0"><div class="kpi"><small>Salariés</small><b>${res.length}</b></div><div class="kpi"><small>Brut total</small><b style="font-size:17px">${fmtF(t('brut'))}</b></div>
    <div class="kpi"><small>Net total</small><b style="font-size:17px">${fmtF(t('net'))}</b></div><div class="kpi"><small>Coût employeur</small><b style="font-size:17px">${fmtF(t('cout'))}</b></div></div>
    <button class="btn ambre" id="pa-save" style="margin-top:12px">Enregistrer comme brouillon</button>`;
  $('#pa-save').onclick = async () => {
    const b = $('#pa-save'); b.disabled = true;
    try{
      const ex = await api(`/rest/v1/payroll_runs?select=id,status&period=eq.${periode}-01`);
      if (ex[0] && ex[0].status === 'validated') throw new Error('Ce mois est déjà validé : il ne peut plus être modifié.');
      if (ex[0]){ if (!confirm('Un brouillon existe déjà pour ce mois : le remplacer ?')){ b.disabled = false; return; } await api(`/rest/v1/payroll_runs?id=eq.${ex[0].id}`, { method:'DELETE' }); }
      const run = (await api('/rest/v1/payroll_runs', { method:'POST', headers:{ Prefer:'return=representation' }, body:{ company_id:S.profile.company_id, period:periode + '-01', status:'draft' } }))[0];
      const slips = await api('/rest/v1/payslips', { method:'POST', headers:{ Prefer:'return=representation' }, body:res.map(r => ({ company_id:S.profile.company_id, run_id:run.id, employee_id:r.emp.id, gross:r.brut, net:r.net, employer_cost:r.cout })) });
      const lignes = []; res.forEach(r => { const s = slips.find(q => q.employee_id === r.emp.id); r.lignes.forEach(l => lignes.push({ payslip_id:s.id, rule_code:l.rule_code === 'base' ? 'base' : null, label:l.label, kind:l.kind, amount:l.amount })); });
      for (let i = 0; i < lignes.length; i += 200) await api('/rest/v1/payslip_lines', { method:'POST', headers:{ Prefer:'return=minimal' }, body:lignes.slice(i, i + 200) });
      toast('Brouillon enregistré'); apres();
    }catch(err){ toast(traduire(err.message)); b.disabled = false; }
  };
}
async function ouvrirMois(run, emps, apres){
  ouvrirFeuille('<p class="sous">Chargement…</p>');
  try{
    const s = await api(`/rest/v1/payslips?select=id,employee_id,gross,net,employer_cost&run_id=eq.${run.id}`);
    const nom = id => { const x = emps.find(q => q.id === id); return x ? `${x.first_name} ${x.last_name}` : 'Salarié'; };
    const valide = run.status === 'validated';
    ouvrirFeuille(`<h2 style="margin-top:0">${esc(moisFr(run.period))} <span class="chip-s ${valide ? 's-ok' : 's-att'}">${valide ? 'Validé' : 'Brouillon'}</span></h2>
      <p class="sous">${s.length} bulletin(s) · Brut ${fmtF(s.reduce((t, x) => t + Number(x.gross), 0))} · Net ${fmtF(s.reduce((t, x) => t + Number(x.net), 0))}</p>
      <div style="margin-top:10px">${s.map(x => `<button class="sal" data-s="${esc(x.id)}"><div><strong>${esc(nom(x.employee_id))}</strong><small>Net : ${fmtF(x.net)}</small></div></button>`).join('')}</div>
      ${valide ? '<p class="note">Mois validé : les salariés peuvent voir leur bulletin. Il ne peut plus être modifié.</p>' : '<button class="btn" id="mo-val">Valider ce mois</button><button class="btn rouge" id="mo-del" style="margin-top:10px">Supprimer ce brouillon</button>'}
      <button class="btn clair" id="mo-x" style="margin-top:10px">Fermer</button>`);
    $('#mo-x').onclick = fermerFeuille;
    $$('#feuille [data-s]').forEach(b => b.onclick = () => { const x = s.find(q => q.id === b.dataset.s); ouvrirBulletin(x, emps.find(q => q.id === x.employee_id) || {}, run.period, true); });
    if ($('#mo-val')) $('#mo-val').onclick = async () => { if (!confirm('Valider ce mois ? Il ne pourra plus être modifié et les salariés verront leur bulletin.')) return;
      try{ await api(`/rest/v1/payroll_runs?id=eq.${run.id}`, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:{ status:'validated' } }); fermerFeuille(); toast('Mois validé'); apres(); }catch(err){ toast(traduire(err.message)); } };
    if ($('#mo-del')) $('#mo-del').onclick = async () => { if (!confirm('Supprimer ce brouillon ?')) return;
      try{ await api(`/rest/v1/payroll_runs?id=eq.${run.id}`, { method:'DELETE' }); fermerFeuille(); toast('Brouillon supprimé'); apres(); }catch(err){ toast(traduire(err.message)); } };
  }catch(err){ ouvrirFeuille(`<p class="msg">${esc(traduire(err.message))}</p><button class="btn clair" id="mo-x">Fermer</button>`); $('#mo-x').onclick = fermerFeuille; }
}

  $('#f-join').onsubmit = async ev => { ev.preventDefault(); const b = $('#j-ok'); b.disabled = true; $('#j-msg').innerHTML = '';
    try{ await api('/rest/v1/rpc/join_company', { method:'POST', body:{ p_code:$('#j-code').value, p_full_name:$('#j-nom').value.trim() || null } }); return loadAll(); }
    catch(err){ $('#j-msg').innerHTML = `<p class="msg">${esc(traduire(err.message))}</p>`; b.disabled = false; } };
}

async function signout(){
  try{ await raw('/auth/v1/logout', { method:'POST' }); }catch{}
  resetLocal(); render();
}

/* ============ Démarrage ============ */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
loadSession();
if (S.session) loadAll(); else { S.loading = false; render(); }
</script>
