<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E4B3A">
<title>RHBox</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --foret:#0E4B3A; --foret-2:#146B52; --ambre:#EE9B1F; --ambre-clair:#FBE3B8;
    --brume:#EDF2EF; --encre:#10211B; --gris:#5E6F68; --ligne:#D5DFDA; --blanc:#fff;
    --rouge:#B3402A; --vert-ok:#1E7F4F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;background:var(--brume);color:var(--encre);-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  :focus-visible{outline:3px solid var(--ambre);outline-offset:2px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  h2{font-size:17px;font-weight:750;letter-spacing:-.01em;margin:22px 0 10px}
  .sous{color:var(--gris);font-size:14px;line-height:1.45;margin-top:6px}
  .note{font-size:12.5px;color:var(--gris);margin-top:14px;line-height:1.4}
  .centre{min-height:100dvh;display:grid;place-items:center;color:var(--gris)}

  /* Connexion et création de l'espace */
  .plein{min-height:100dvh;padding:34px 20px 40px;display:flex;flex-direction:column;align-items:center}
  .plein>*{width:100%;max-width:440px}
  .plein.vert{background:var(--foret);color:var(--blanc)}
  .plein.vert .sous{color:#bcd7cc}
  .logo-ligne{display:flex;align-items:center;gap:12px;margin-bottom:24px;font-size:24px;font-weight:800;letter-spacing:-.02em}
  .form label{display:block;font-size:13px;color:var(--gris);margin:14px 0 6px}
  .vert .form label{color:#bcd7cc}
  .form input,.form select{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--ligne);background:var(--blanc);font-size:16px}
  .vert .form input,.vert .form select{background:#0b3f31;border-color:#2f7a63;color:var(--blanc)}
  .btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:750;font-size:16px;background:var(--foret);color:var(--blanc);margin-top:20px}
  .btn.ambre{background:var(--ambre);color:var(--encre)}
  .btn.clair{background:var(--brume);color:var(--foret)}
  .btn.rouge{background:#f6d9d3;color:var(--rouge)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .lien{margin-top:18px;color:var(--foret-2);text-decoration:underline;font-size:14px;text-align:center;width:100%}
  .vert .lien{color:#bcd7cc}
  .msg{margin-top:14px;font-size:14px;color:var(--rouge);background:var(--blanc);padding:11px 13px;border-radius:10px;line-height:1.4}
  .msg.ok{color:var(--vert-ok)}
  .combo{position:relative}
  .options{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;list-style:none;background:var(--blanc);color:var(--encre);border-radius:12px;max-height:230px;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}
  .options.ouvert{display:block}
  .options li{padding:12px 14px;font-size:15px;border-bottom:1px solid var(--ligne);cursor:pointer}
  .options li:last-child{border-bottom:0}
  .options li:hover{background:var(--ambre-clair)}
  .options li.perso{font-weight:700;color:var(--foret)}
  .pack{margin-top:18px;background:var(--blanc);color:var(--encre);border-radius:16px;padding:16px;border-left:6px solid var(--ambre);font-size:14px;line-height:1.7}

  /* Application */
  .app{display:flex;flex-direction:column;height:100dvh}
  .ecran{flex:1;overflow-y:auto;padding:20px 18px 28px}
  .ecran>*{max-width:900px;margin-left:auto;margin-right:auto}
  .tabs{display:flex;background:var(--blanc);border-top:1px solid var(--ligne);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;color:var(--gris);border-radius:10px}
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-selected="true"]{color:var(--foret);font-weight:700}
  .tab[aria-selected="true"]::after{content:"";width:18px;height:3px;border-radius:2px;background:var(--ambre);margin-top:1px}
  .brand{display:none}

  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
  .kpi{background:var(--blanc);border-radius:14px;padding:14px}
  .kpi small{display:block;color:var(--gris);font-size:12.5px;margin-bottom:4px}
  .kpi b{font-size:22px;letter-spacing:-.02em}
  .carte{background:var(--blanc);border-radius:16px;padding:14px;margin-bottom:10px}
  .etape{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--ligne);font-size:15px}
  .etape:first-child{border-top:0}
  .pastille{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ligne);display:grid;place-items:center;font-size:13px;font-weight:800;margin-top:1px}
  .pastille.fait{background:var(--foret-2);border-color:var(--foret-2);color:var(--blanc)}
  .recherche{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--ligne);background:var(--blanc);font-size:15px;margin:14px 0 10px}
  .sal{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--blanc);border-radius:14px;padding:12px;margin-bottom:8px}
  .avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ambre-clair);color:var(--foret);font-weight:800;display:grid;place-items:center}
  .sal strong{display:block;font-size:15px}
  .sal small{color:var(--gris);font-size:13px}
  .modules{background:var(--blanc);border-radius:16px;overflow:hidden}
  .module{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-top:1px solid var(--ligne);font-size:15px}
  .module:first-child{border-top:0}
  .module small{display:block;color:var(--gris);font-size:12.5px;margin-top:2px}
  .bientot{font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--brume);color:var(--gris);white-space:nowrap}
  .switch{position:relative;width:46px;height:28px;border-radius:14px;background:#b9c6c0;flex:none;transition:background .15s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--blanc);transition:transform .15s}
  .switch[aria-checked="true"]{background:var(--foret-2)}
  .switch[aria-checked="true"]::after{transform:translateX(18px)}
  .switch[disabled]{opacity:.5;cursor:not-allowed}
  .ligne-info{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--ligne);font-size:14.5px}
  .ligne-info:first-child{border-top:0}
  .ligne-info span:first-child{color:var(--gris)}
  .ligne-info span:last-child{font-weight:650;text-align:right}

  .fond{position:fixed;inset:0;background:rgba(16,33,27,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .fond.visible{display:flex}
  .feuille{background:var(--blanc);width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px 26px}
  .petit{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--brume);color:var(--foret);font-weight:700}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--encre);color:var(--blanc);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90%;text-align:center}
  .toast.on{opacity:1}

  @media (min-width:900px){
    .app{flex-direction:row}
    .tabs{order:-1;flex-direction:column;justify-content:flex-start;width:230px;flex:none;border-top:0;border-right:1px solid var(--ligne);padding:20px 14px;gap:3px}
    .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:11px 14px;text-align:left}
    .tab[aria-selected="true"]{background:var(--brume)}
    .tab[aria-selected="true"]::after{display:none}
    .brand{display:flex;align-items:center;gap:10px;padding:2px 10px 16px;font-weight:800;font-size:20px;letter-spacing:-.02em}
    .ecran{padding:32px 40px 40px}
    .fond{align-items:center}
    .feuille{border-radius:22px;max-width:460px}
    .toast{bottom:28px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 64 64">
    <polygon points="8,20 32,33 32,59 8,46" fill="#0b3f31"/>
    <polygon points="56,20 32,33 32,59 56,46" fill="#146B52"/>
    <polygon points="32,7 56,20 32,33 8,20" fill="#EE9B1F"/>
    <circle cx="32" cy="16.5" r="4.6" fill="#fff"/>
    <path d="M23.5 23.5c1.6-4.2 4.8-5.6 8.5-5.6s6.9 1.4 8.5 5.6L32 28.3z" fill="#fff"/>
  </symbol>
</svg>
<div id="root"><div class="centre">Chargement…</div></div>
<div class="fond" id="fond"><div class="feuille" id="feuille" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ Configuration (clés publiques : sans danger dans l'application) ============ */
const CFG = {
  url: 'https://bikimifpstkzcyocxmbg.supabase.co',
  // Clé "anon" publique du projet. Ne mettez JAMAIS ici la clé service_role ni le mot de passe de la base.
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpa2ltaWZwc3RremN5b2N4bWJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzOTY5MTIsImV4cCI6MjEwNjk3MjkxMn0.wggNLKWaPiu-17KafuDNP-8zCkPZEejrlSgV7QoycT0'
};

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const ini = (a, b) => ((a || '')[0] || '') + ((b || '')[0] || '');

const ROLES = { admin:'Administrateur', drh:'DRH', hr_manager:'Responsable RH', hr_assistant:'Assistant RH', manager:'Manager', employee:'Salarié' };
const RH = ['admin','drh','hr_manager','hr_assistant'];
const RH_SENIOR = ['admin','drh','hr_manager'];
const MODULES = {
  employees:['Salariés','Dossiers, contrats, documents',true],
  attendance:['Présence','Pointage, retards, heures supplémentaires',false],
  leave:['Congés','Demandes, validation, soldes',false],
  payroll:['Paie','Bulletins, primes, cotisations',false],
  recruitment:['Recrutement','Offres, candidats, score expliqué',false],
  career:['Carrière et formation','Évaluations, compétences, formations',false],
  communication:['Communication','Annonces et notes de service',false],
  documents:['Documents','Contrats, attestations, bulletins',false],
  reports:['Rapports','Masse salariale, effectifs, exports',false],
  ai:['Assistant IA','Questions sur le droit du travail',false]
};

const S = { session:null, profile:null, company:null, employees:[], modules:[], countries:[], sectors:[], tab:'accueil', loading:true, recherche:'' };

/* ============ Accès à Supabase (sans bibliothèque) ============ */
function saveSession(d){
  S.session = { access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600), user:d.user };
  localStorage.setItem('rhbox_session', JSON.stringify(S.session));
}
function loadSession(){ try{ S.session = JSON.parse(localStorage.getItem('rhbox_session')); }catch{ S.session = null; } }
function resetLocal(){
  S.session = null; S.profile = null; S.company = null; S.employees = []; S.modules = []; S.me = null; S.tab = 'accueil';
  localStorage.removeItem('rhbox_session');
}
async function raw(path, { method='GET', body, headers={}, auth=true } = {}){
  const h = { apikey: CFG.key, 'Content-Type':'application/json', ...headers };
  if (auth && S.session) h.Authorization = 'Bearer ' + S.session.access_token;
  const r = await fetch(CFG.url + path, { method, headers:h, body: body ? JSON.stringify(body) : undefined });
  const t = await r.text(); let data = null;
  if (t){ try{ data = JSON.parse(t); }catch{ data = t; } }
  if (!r.ok){
    const m = (data && (data.message || data.msg || data.error_description || data.error)) || ('Erreur ' + r.status);
    const e = new Error(m); e.status = r.status; throw e;
  }
  return data;
}
async function refreshIfNeeded(){
  if (!S.session || S.session.expires_at - 60 > Date.now()/1000) return;
  try{
    const d = await raw('/auth/v1/token?grant_type=refresh_token', { method:'POST', body:{ refresh_token:S.session.refresh_token }, auth:false });
    saveSession(d);
  }catch{ resetLocal(); render(); throw new Error('Session expirée, reconnectez-vous.'); }
}
async function api(path, opts={}){ await refreshIfNeeded(); return raw(path, opts); }

function traduire(m){
  if (/invalid login/i.test(m)) return 'E-mail ou mot de passe incorrect.';
  if (/not confirmed/i.test(m)) return "Confirmez d'abord votre e-mail (lien reçu par message).";
  if (/already registered|already been registered/i.test(m)) return 'Un compte existe déjà avec cet e-mail.';
  if (/password/i.test(m) && /6|8|short|weak/i.test(m)) return 'Mot de passe trop court (8 caractères minimum).';
  if (/failed to fetch|networkerror/i.test(m)) return 'Pas de connexion internet.';
  return m;
}

/* ============ Chargement des données ============ */
async function loadRefs(){
  const [c, s] = await Promise.all([
    api('/rest/v1/countries?select=code,name,currency&order=name.asc'),
    api('/rest/v1/sectors?select=name&order=name.asc')
  ]);
  S.countries = c; S.sectors = s.map(x => x.name);
}
async function loadCompany(){
  const [co, mo] = await Promise.all([
    api('/rest/v1/companies?select=id,name,country_code,sector_name'),
    api('/rest/v1/company_modules?select=module_code,enabled')
  ]);
  S.company = co[0] || null; S.modules = mo;
  await loadEmployees();
  await loadMe();
}
async function loadEmployees(){
  S.employees = await api('/rest/v1/employees?select=id,first_name,last_name,job_title,department,matricule,phone,email,hired_on&order=last_name.asc');
}
async function loadMe(){
  const r = await api(`/rest/v1/employees?select=id,first_name,last_name,job_title,phone,address,birth_date,marital_status&user_id=eq.${S.session.user.id}&limit=1`);
  S.me = r[0] || null;
}
async function loadAll(){
  S.loading = true; render();
  try{
    await loadRefs();
    const p = await api(`/rest/v1/profiles?select=id,company_id,full_name,role,email&id=eq.${S.session.user.id}`);
    S.profile = p[0] || null;
    if (S.profile) await loadCompany();
  }catch(e){ toast(traduire(e.message)); }
  S.loading = false; render();
}

/* ============ Affichage ============ */
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); }
function ouvrirFeuille(html){ $('#feuille').innerHTML = html; $('#fond').classList.add('visible'); }
function fermerFeuille(){ $('#fond').classList.remove('visible'); }
$('#fond').addEventListener('click', e => { if (e.target.id === 'fond') fermerFeuille(); });
const logo = t => `<div class="logo-ligne"><svg width="52" height="52" aria-hidden="true"><use href="#logo"/></svg><span>${t}</span></div>`;

function render(){
  const root = $('#root');
  if (S.loading) { root.innerHTML = '<div class="centre">Chargement…</div>'; return; }
  if (!S.session) return viewAuth(root);
  if (!S.profile) return viewOnboard(root);
  viewApp(root);
}

/* ---------- Connexion / inscription ---------- */
let modeAuth = 'connexion';
function viewAuth(root){
  root.innerHTML = `<main class="plein">
    ${logo('RHBox')}
    <h1>${modeAuth === 'connexion' ? 'Connexion' : 'Créer votre compte'}</h1>
    <p class="sous">${modeAuth === 'connexion' ? 'Retrouvez l\'espace RH de votre entreprise.' : 'Quelques secondes suffisent pour commencer.'}</p>
    <form class="form" id="f-auth">
      <label for="email">E-mail</label>
      <input id="email" type="email" required autocomplete="email" inputmode="email">
      <label for="pwd">Mot de passe</label>
      <input id="pwd" type="password" required minlength="8" autocomplete="${modeAuth === 'connexion' ? 'current-password' : 'new-password'}">
      <button class="btn" id="b-auth">${modeAuth === 'connexion' ? 'Se connecter' : 'Créer mon compte'}</button>
    </form>
    <div id="msg-auth" role="status"></div>
    <button class="lien" id="b-mode">${modeAuth === 'connexion' ? "Pas encore de compte ? S'inscrire" : 'Déjà un compte ? Se connecter'}</button>
  </main>`;
  $('#b-mode').onclick = () => { modeAuth = modeAuth === 'connexion' ? 'inscription' : 'connexion'; render(); };
  $('#f-auth').onsubmit = async e => {
    e.preventDefault();
    const email = $('#email').value.trim(), password = $('#pwd').value;
    const b = $('#b-auth'), m = $('#msg-auth'); b.disabled = true; m.innerHTML = '';
    try{
      if (modeAuth === 'inscription'){
        const d = await raw('/auth/v1/signup', { method:'POST', body:{ email, password }, auth:false });
        if (d && d.access_token){ saveSession(d); return loadAll(); }
        m.innerHTML = '<p class="msg ok">Compte créé. Confirmez votre e-mail avec le lien reçu, puis connectez-vous.</p>';
        modeAuth = 'connexion';
      } else {
        const d = await raw('/auth/v1/token?grant_type=password', { method:'POST', body:{ email, password }, auth:false });
        saveSession(d); return loadAll();
      }
    }catch(err){ m.innerHTML = `<p class="msg">${esc(traduire(err.message))}</p>`; }
    b.disabled = false;
  };
}

/* ---------- Création de l'espace ---------- */
function viewOnboard(root){
  root.innerHTML = `<main class="plein vert">
    ${logo('RHBox')}
    <h1>Créez l'espace RH de votre entreprise</h1>
    <p class="sous">Choisissez votre pays et votre secteur d'activité.</p>
    <form class="form" id="f-on">
      <label for="ent">Nom de l'entreprise</label>
      <input id="ent" required autocomplete="organization">
      <label for="nom">Votre nom</label>
      <input id="nom" autocomplete="name">
      <label for="pays">Pays</label>
      <select id="pays" required><option value="">Choisir un pays</option>${S.countries.map(c => `<option value="${esc(c.code)}">${esc(c.name)}</option>`).join('')}</select>
      <div class="combo"><label for="sect">Secteur d'activité</label>
        <input id="sect" required autocomplete="off" placeholder="Chercher votre secteur" role="combobox" aria-expanded="false" aria-controls="opts">
        <ul class="options" id="opts" role="listbox"></ul></div>
      <div id="pack"></div>
      <button class="btn ambre" id="b-on" disabled>Créer mon espace</button>
    </form>
    <div id="msg-on" role="alert"></div>
    <button class="lien" id="b-out">Se déconnecter</button>
  </main>`;
  const sect = $('#sect'), opts = $('#opts');
  let choisi = '';
  const maj = () => {
    const c = S.countries.find(x => x.code === $('#pays').value);
    $('#pack').innerHTML = (c && choisi) ? `<div class="pack"><strong>Votre espace</strong><br>Pays : ${esc(c.name)}<br>Monnaie : ${esc(c.currency)}<br>Secteur : ${esc(choisi)}<br><span style="color:var(--gris);font-size:13px">Les règles de paie et de congés seront activées après vérification des textes officiels du pays.</span></div>` : '';
    $('#b-on').disabled = !(c && choisi);
  };
  const liste = () => {
    const brut = sect.value.trim(), q = norm(brut);
    const res = S.sectors.filter(s => norm(s).includes(q)).slice(0, 12);
    let h = res.map(s => `<li role="option" data-v="${esc(s)}">${esc(s)}</li>`).join('');
    if (brut && !S.sectors.some(s => norm(s) === q)) h += `<li role="option" class="perso" data-v="${esc(brut)}">Utiliser « ${esc(brut)} »</li>`;
    opts.innerHTML = h; opts.classList.toggle('ouvert', !!h); sect.setAttribute('aria-expanded', !!h);
  };
  sect.oninput = () => { choisi = ''; maj(); liste(); };
  sect.onfocus = liste;
  opts.onmousedown = opts.ontouchstart = e => {
    const li = e.target.closest('li'); if (!li) return;
    e.preventDefault(); choisi = li.dataset.v; sect.value = choisi; opts.classList.remove('ouvert'); maj();
  };
  sect.onblur = () => { setTimeout(() => { opts.classList.remove('ouvert'); if (!choisi && sect.value.trim()){ const ex = S.sectors.find(s => norm(s) === norm(sect.value.trim())); choisi = ex || sect.value.trim(); sect.value = choisi; maj(); } }, 150); };
  $('#pays').onchange = maj;
  $('#b-out').onclick = signout;
  $('#f-on').onsubmit = async e => {
    e.preventDefault();
    const b = $('#b-on'); b.disabled = true; $('#msg-on').innerHTML = '';
    try{
      await api('/rest/v1/rpc/create_company', { method:'POST', body:{ p_name:$('#ent').value, p_country:$('#pays').value, p_sector:choisi, p_full_name:$('#nom').value || null } });
      return loadAll();
    }catch(err){ $('#msg-on').innerHTML = `<p class="msg">${esc(traduire(err.message))}</p>`; b.disabled = false; }
  };
}

/* ---------- Application ---------- */
const ICONES = {
  accueil:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  salaries:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.8 3.3-5.5 6.5-5.5s5.9 1.7 6.5 5.5"/><path d="M16 5a3.3 3.3 0 0 1 0 6.2M18 14.8c2 .6 3.2 2.300 3.500 5.200"/>',
  modules:'<rect x="3.500" y="3.500" width="7" height="7" rx="1.500"/><rect x="13.500" y="3.500" width="7" height="7" rx="1.500"/><rect x="3.500" y="13.500" width="7" height="7" rx="1.500"/><rect x="13.500" y="13.500" width="7" height="7" rx="1.500"/>',
  compte:'<circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.200 4-6 8-6s7.200 1.800 8 6"/>'
};
const TABS = [['accueil','Accueil'],['salaries','Salariés'],['modules','Modules'],['compte','Compte']];
const nomPays = c => (S.countries.find(x => x.code === c) || {}).name || c;
const peutEcrire = () => RH.includes(S.profile.role);
const peutSupprimer = () => RH_SENIOR.includes(S.profile.role);

function viewApp(root){
  root.innerHTML = `<div class="app">
    <div class="ecran" id="ecran"></div>
    <nav class="tabs" aria-label="Navigation">
      <div class="brand"><svg width="34" height="34" aria-hidden="true"><use href="#logo"/></svg><span>RHBox</span></div>
      ${TABS.map(([k, l]) => `<button class="tab" data-t="${k}" aria-selected="${S.tab === k}"><svg viewBox="0 0 24 24">${ICONES[k]}</svg>${l}</button>`).join('')}
    </nav></div>`;
  root.querySelectorAll('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.t; viewApp(root); });
  const e = $('#ecran');
  ({ accueil:tabAccueil, salaries:tabSalaries, modules:tabModules, compte:tabCompte })[S.tab](e);
}

function tabAccueil(e){
  const actifs = S.modules.filter(m => m.enabled).length;
  const aDesSalaries = S.employees.length > 0;
  e.innerHTML = `<h1>${esc(S.company.name)}</h1>
    <p class="sous">${esc(nomPays(S.company.country_code))} · ${esc(S.company.sector_name)}</p>
    <div class="kpis">
      <div class="kpi"><small>Salariés</small><b>${S.employees.length}</b></div>
      <div class="kpi"><small>Modules actifs</small><b>${actifs}</b></div>
      <div class="kpi"><small>Votre rôle</small><b style="font-size:16px">${esc(ROLES[S.profile.role])}</b></div>
    </div>
    <h2>Pour commencer</h2>
    <div class="carte">
      <div class="etape"><span class="pastille fait">✓</span><span>Espace de l'entreprise créé</span></div>
      <div class="etape"><span class="pastille ${aDesSalaries ? 'fait' : ''}">${aDesSalaries ? '✓' : '2'}</span><span>${aDesSalaries ? 'Premiers salariés ajoutés' : 'Ajoutez vos premiers salariés (onglet Salariés)'}</span></div>
      <div class="etape"><span class="pastille">3</span><span>Congés, présence et paie : bientôt disponibles</span></div>
    </div>
    <p class="note">Les règles de paie et de congés de chaque pays seront activées après vérification des textes officiels.</p>`;
}

function listeSalaries(){
  const q = norm(S.recherche);
  const res = S.employees.filter(x => norm(`${x.first_name} ${x.last_name} ${x.job_title || ''}`).includes(q));
  const z = $('#liste-sal');
  z.innerHTML = res.length ? res.map(x => `<button class="sal" data-id="${esc(x.id)}"><div class="avatar">${esc(ini(x.first_name, x.last_name))}</div><div><strong>${esc(x.first_name)} ${esc(x.last_name)}</strong><small>${esc(x.job_title || 'Poste à préciser')}</small></div></button>`).join('')
    : `<p class="sous">${S.employees.length ? 'Aucun salarié ne correspond.' : 'Aucun salarié pour le moment.'}</p>`;
  z.querySelectorAll('.sal').forEach(b => b.onclick = () => ficheSalarie(b.dataset.id));
}
function tabSalaries(e){
  e.innerHTML = `<h1>Salariés</h1><p class="sous">${S.employees.length} dossier${S.employees.length > 1 ? 's' : ''}</p>
    ${peutEcrire() ? '<button class="btn" id="b-add" style="margin-top:14px">Ajouter un salarié</button>' : ''}
    <input class="recherche" id="rech" type="search" placeholder="Chercher un nom ou un poste" aria-label="Chercher un salarié" value="${esc(S.recherche)}">
    <div id="liste-sal"></div>`;
  $('#rech').oninput = ev => { S.recherche = ev.target.value; listeSalaries(); };
  if ($('#b-add')) $('#b-add').onclick = formSalarie;
  listeSalaries();
}
function formSalarie(){
  ouvrirFeuille(`<h2 style="margin-top:0">Nouveau salarié</h2><form class="form" id="f-sal">
    <label for="s-p">Prénom</label><input id="s-p" required>
    <label for="s-n">Nom</label><input id="s-n" required>
    <label for="s-j">Poste</label><input id="s-j">
    <label for="s-d">Service</label><input id="s-d">
    <label for="s-m">Matricule</label><input id="s-m">
    <label for="s-t">Téléphone</label><input id="s-t" type="tel">
    <label for="s-e">E-mail</label><input id="s-e" type="email">
    <label for="s-h">Date d'embauche</label><input id="s-h" type="date">
    <button class="btn" id="s-ok">Ajouter</button>
    <button class="btn clair" type="button" id="s-no">Annuler</button></form><div id="s-msg"></div>`);
  $('#s-no').onclick = fermerFeuille;
  $('#f-sal').onsubmit = async ev => {
    ev.preventDefault(); const b = $('#s-ok'); b.disabled = true;
    const v = id => $(id).value.trim() || null;
    try{
      await api('/rest/v1/employees', { method:'POST', headers:{ Prefer:'return=minimal' }, body:{
        company_id:S.profile.company_id, first_name:$('#s-p').value.trim(), last_name:$('#s-n').value.trim(),
        job_title:v('#s-j'), department:v('#s-d'), matricule:v('#s-m'), phone:v('#s-t'), email:v('#s-e'), hired_on:v('#s-h') } });
      await loadEmployees(); fermerFeuille(); toast('Salarié ajouté'); viewApp($('#root'));
    }catch(err){ $('#s-msg').innerHTML = `<p class="msg">${esc(traduire(err.message))}</p>`; b.disabled = false; }
  };
}
function ficheSalarie(id){
  const x = S.employees.find(s => s.id === id); if (!x) return;
  const l = (a, b) => `<div class="ligne-info"><span>${a}</span><span>${esc(b || 'Non renseigné')}</span></div>`;
  ouvrirFeuille(`<div style="display:flex;gap:14px;align-items:center;margin-bottom:12px"><div class="avatar" style="width:56px;height:56px;font-size:19px">${esc(ini(x.first_name, x.last_name))}</div>
    <div><strong style="font-size:18px">${esc(x.first_name)} ${esc(x.last_name)}</strong><br><small style="color:var(--gris)">${esc(x.job_title || 'Poste à préciser')}</small></div></div>
    ${l('Service', x.department)}${l('Matricule', x.matricule)}${l('Téléphone', x.phone)}${l('E-mail', x.email)}${l("Date d'embauche", x.hired_on)}
    <h2>Documents</h2><div class="carte" id="f-docs" style="padding:4px 12px">Chargement…</div>
    ${peutEcrire() ? '<button class="btn clair" id="f-adddoc" style="margin-top:0">Ajouter un document</button>' : ''}
    ${peutSupprimer() ? '<button class="btn rouge" id="f-del">Supprimer ce dossier</button>' : ''}
    <button class="btn clair" id="f-close">Fermer</button>`);
  $('#f-close').onclick = fermerFeuille;
  chargerDocs(x.id, '#f-docs', peutEcrire());
  if ($('#f-adddoc')) $('#f-adddoc').onclick = () => formDoc(async () => x.id, () => ficheSalarie(x.id));
  if ($('#f-del')) $('#f-del').onclick = async () => {
    if (!confirm('Supprimer définitivement ce dossier ?')) return;
    try{ await api(`/rest/v1/employees?id=eq.${encodeURIComponent(id)}`, { method:'DELETE' }); await loadEmployees(); fermerFeuille(); toast('Dossier supprimé'); viewApp($('#root')); }
    catch(err){ toast(traduire(err.message)); }
  };
}

function tabModules(e){
  const droit = ['admin','drh'].includes(S.profile.role);
  const etat = c => (S.modules.find(m => m.module_code === c) || {}).enabled;
  e.innerHTML = `<h1>Modules</h1><p class="sous">Chaque module peut être activé ou non pour votre entreprise.</p>
    <div class="modules" style="margin-top:16px">${Object.entries(MODULES).map(([c, [nom, desc, dispo]]) => `
      <div class="module"><div>${nom}<small>${desc}</small></div>
      ${dispo ? `<button class="switch" role="switch" data-c="${c}" aria-checked="${!!etat(c)}" aria-label="${nom}" ${droit ? '' : 'disabled'}></button>` : '<span class="bientot">Bientôt</span>'}</div>`).join('')}</div>
    ${droit ? '' : '<p class="note">Seuls l\'administrateur et le DRH peuvent modifier les modules.</p>'}`;
  e.querySelectorAll('.switch').forEach(b => b.onclick = async () => {
    const nv = b.getAttribute('aria-checked') !== 'true';
    try{
      await api(`/rest/v1/company_modules?company_id=eq.${S.profile.company_id}&module_code=eq.${b.dataset.c}`, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:{ enabled:nv } });
      const m = S.modules.find(x => x.module_code === b.dataset.c); if (m) m.enabled = nv;
      b.setAttribute('aria-checked', nv);
    }catch(err){ toast(traduire(err.message)); }
  });
}

let invite = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); invite = e; const b = $('#b-inst'); if (b) b.style.display = 'block'; });
function tabCompte(e){
  const m = S.me || {};
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const installee = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  e.innerHTML = `<h1>Mon compte</h1>
    <div class="carte" style="margin-top:16px">
      <div class="ligne-info"><span>E-mail</span><span>${esc(S.session.user.email)}</span></div>
      <div class="ligne-info"><span>Rôle</span><span>${esc(ROLES[S.profile.role])}</span></div>
      <div class="ligne-info"><span>Entreprise</span><span>${esc(S.company.name)}</span></div>
    </div>
    <h2>Mes informations</h2>
    <form class="form carte" id="f-me">
      <label for="m-nom" style="margin-top:0">Nom complet</label><input id="m-nom" value="${esc(S.profile.full_name || '')}" autocomplete="name">
      <label for="m-poste">Poste</label><input id="m-poste" value="${esc(m.job_title || '')}">
      <label for="m-tel">Téléphone</label><input id="m-tel" type="tel" value="${esc(m.phone || '')}" autocomplete="tel">
      <label for="m-adr">Adresse</label><input id="m-adr" value="${esc(m.address || '')}" autocomplete="street-address">
      <label for="m-nais">Date de naissance</label><input id="m-nais" type="date" value="${esc(m.birth_date || '')}">
      <label for="m-sit">Situation familiale</label>
      <select id="m-sit"><option value="">Non renseignée</option>${SITUATIONS.map(s => `<option ${m.marital_status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <button class="btn" id="m-ok">Enregistrer</button>
    </form>
    <h2>Mes documents</h2>
    <div class="carte" id="mes-docs" style="padding:4px 12px">Chargement…</div>
    <button class="btn" id="b-adddoc" style="margin-top:0">Ajouter un document</button>
    <p class="note">Carte d'identité, passeport, diplômes… Vos documents sont privés : vous et les responsables RH de votre entreprise y avez accès.</p>
    ${installee ? '' : `<button class="btn clair" id="b-inst" style="display:${invite ? 'block' : 'none'}">Installer l'application</button>
    <p class="note">${ios ? "Sur iPhone : touchez le bouton Partager de Safari, puis « Sur l'écran d'accueil »." : "Sur Android : menu du navigateur (⋮), puis « Installer l'application » ou « Ajouter à l'écran d'accueil »."}</p>`}
    <button class="btn clair" id="b-quit">Se déconnecter</button>`;
  $('#b-quit').onclick = signout;
  if ($('#b-inst')) $('#b-inst').onclick = async () => { if (invite){ invite.prompt(); invite = null; } };
  $('#f-me').onsubmit = async ev => {
    ev.preventDefault(); const b = $('#m-ok'); b.disabled = true;
    try{
      await api('/rest/v1/rpc/save_my_info', { method:'POST', body:{
        p_full_name:$('#m-nom').value, p_phone:$('#m-tel').value, p_address:$('#m-adr').value,
        p_birth_date:$('#m-nais').value || null, p_marital_status:$('#m-sit').value, p_job_title:$('#m-poste').value } });
      S.profile.full_name = $('#m-nom').value.trim() || null;
      await loadMe(); await loadEmployees(); toast('Informations enregistrées'); tabCompte($('#ecran'));
    }catch(err){ toast(traduire(err.message)); b.disabled = false; }
  };
  chargerDocs(S.me && S.me.id, '#mes-docs', true);
  $('#b-adddoc').onclick = () => formDoc(monEmployeId, id => chargerDocs(id, '#mes-docs', true));
}

/* ============ Documents personnels ============ */
const DOC_TYPES = { cni:"Carte d'identité (CNI)", passeport:'Passeport', permis:'Permis de conduire', diplome:'Diplôme', contrat:'Contrat', attestation:'Attestation', autre:'Autre document' };
const SITUATIONS = ['Célibataire','Marié(e)','Divorcé(e)','Veuf(ve)','Union libre'];
const chemin = p => p.split('/').map(encodeURIComponent).join('/');

async function monEmployeId(){
  if (S.me) return S.me.id;
  const id = await api('/rest/v1/rpc/ensure_my_employee', { method:'POST', body:{} });
  await loadMe(); await loadEmployees();
  return id;
}
async function chargerDocs(empId, sel, peutSuppr){
  const z = $(sel); if (!z) return;
  if (!empId){ z.innerHTML = '<p class="sous" style="padding:10px 0">Aucun document pour le moment.</p>'; return; }
  try{
    const d = await api(`/rest/v1/documents?select=id,kind,name,storage_key,created_at&employee_id=eq.${encodeURIComponent(empId)}&order=created_at.desc`);
    z.innerHTML = d.length ? d.map(x => `<div class="ligne-info" style="align-items:center">
        <span style="color:var(--encre)"><strong style="display:block;font-size:14.5px">${esc(x.name)}</strong><small style="color:var(--gris)">${esc(DOC_TYPES[x.kind] || x.kind)}</small></span>
        <span><button class="petit" data-o="${esc(x.storage_key)}">Ouvrir</button>${peutSuppr ? ` <button class="petit" data-s="${esc(x.id)}" data-k="${esc(x.storage_key)}" style="color:var(--rouge)">Supprimer</button>` : ''}</span></div>`).join('')
      : '<p class="sous" style="padding:10px 0">Aucun document pour le moment.</p>';
    z.querySelectorAll('[data-o]').forEach(b => b.onclick = () => ouvrirDoc(b.dataset.o));
    z.querySelectorAll('[data-s]').forEach(b => b.onclick = async () => {
      if (!confirm('Supprimer ce document ?')) return;
      await supprimerDoc(b.dataset.s, b.dataset.k); chargerDocs(empId, sel, peutSuppr);
    });
  }catch(err){ z.innerHTML = `<p class="msg">${esc(traduire(err.message))}</p>`; }
}
async function ouvrirDoc(path){
  const w = window.open('', '_blank');
  try{
    const d = await api(`/storage/v1/object/sign/documents/${chemin(path)}`, { method:'POST', body:{ expiresIn:120 } });
    const url = CFG.url + '/storage/v1' + d.signedURL;
    if (w) w.location = url; else location.href = url;
  }catch(err){ if (w) w.close(); toast(traduire(err.message)); }
}
async function supprimerDoc(id, path){
  try{ await api(`/storage/v1/object/documents/${chemin(path)}`, { method:'DELETE' }); }catch{}
  try{ await api(`/rest/v1/documents?id=eq.${encodeURIComponent(id)}`, { method:'DELETE' }); toast('Document supprimé'); }
  catch(err){ toast(traduire(err.message)); }
}
async function envoyerDoc(empId, kind, label, file){
  if (file.size > 10 * 1024 * 1024) throw new Error('Fichier trop lourd (10 Mo maximum).');
  await refreshIfNeeded();
  const propre = file.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9._-]/g, '_');
  const path = `${S.profile.company_id}/${empId}/${Date.now()}-${propre}`;
  const r = await fetch(`${CFG.url}/storage/v1/object/documents/${chemin(path)}`, { method:'POST',
    headers:{ apikey:CFG.key, Authorization:'Bearer ' + S.session.access_token, 'Content-Type': file.type || 'application/octet-stream', 'x-upsert':'false' }, body:file });
  if (!r.ok){ let m = "Envoi impossible"; try{ const j = await r.json(); m = j.message || j.error || m; }catch{} throw new Error(m); }
  try{
    await api('/rest/v1/documents', { method:'POST', headers:{ Prefer:'return=minimal' },
      body:{ company_id:S.profile.company_id, employee_id:empId, kind, name:label || file.name, storage_key:path } });
  }catch(err){ try{ await api(`/storage/v1/object/documents/${chemin(path)}`, { method:'DELETE' }); }catch{} throw err; }
}
function formDoc(getEmpId, apres){
  ouvrirFeuille(`<h2 style="margin-top:0">Ajouter un document</h2><form class="form" id="f-doc">
    <label for="d-type">Type</label><select id="d-type">${Object.entries(DOC_TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
    <label for="d-nom">Nom (facultatif)</label><input id="d-nom" placeholder="Ex. Passeport">
    <label for="d-file">Fichier (photo ou PDF, 10 Mo maximum)</label><input id="d-file" type="file" accept="image/*,application/pdf" required>
    <button class="btn" id="d-ok">Envoyer</button>
    <button class="btn clair" type="button" id="d-no">Annuler</button></form><div id="d-msg"></div>`);
  $('#d-no').onclick = fermerFeuille;
  $('#f-doc').onsubmit = async ev => {
    ev.preventDefault(); const b = $('#d-ok'); b.disabled = true; b.textContent = 'Envoi en cours…';
    try{
      const f = $('#d-file').files[0]; if (!f) throw new Error('Choisissez un fichier.');
      const id = await getEmpId();
      await envoyerDoc(id, $('#d-type').value, $('#d-nom').value.trim(), f);
      fermerFeuille(); toast('Document ajouté'); apres(id);
    }catch(err){ $('#d-msg').innerHTML = `<p class="msg">${esc(traduire(err.message))}</p>`; b.disabled = false; b.textContent = 'Envoyer'; }
  };
}

async function signout(){
  try{ await raw('/auth/v1/logout', { method:'POST' }); }catch{}
  resetLocal(); render();
}

/* ============ Démarrage ============ */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
loadSession();
if (S.session) loadAll(); else { S.loading = false; render(); }
</script>
